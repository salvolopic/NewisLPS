<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Cliente - NewisLPS</title>
   <link rel="stylesheet" href="/css/common-styles.css">
</head>

<body>

    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <div class="logo-text" style="color: #00a86b; font-size: 42px;">NewisLPS</div>
                <h1>Accesso Cliente</h1>
                <p style="color: #999;">Accedi per usufruire del distributore</p>
            </div>

            <form id="cliente-login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="salvo.lopiccolo@email.com" required minlength="5">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="********" required minlength="6">
                </div>

                <button type="submit" class="btn">Accedi</button>
            </form>
        
            <div class="link">
                <a href="cliente-registrazione.html" style="color: #00a86b; text-decoration: none;">Non hai un account? Registrati</a>
            </div>

    </div>

      <script src="/js/cliente-login.js"></script>
    
</body>
</html>
