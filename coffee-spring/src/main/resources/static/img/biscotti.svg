<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Main biscotto (cookie) -->
  <ellipse cx="100" cy="100" rx="60" ry="50" fill="#D4A574" stroke="#B8956A" stroke-width="2"/>

  <!-- Texture and shading -->
  <ellipse cx="100" cy="100" rx="55" ry="45" fill="#C19A6B" opacity="0.5"/>

  <!-- Chocolate chips scattered on the biscotto -->
  <circle cx="75" cy="85" r="5" fill="#5D4037"/>
  <circle cx="95" cy="80" r="4" fill="#5D4037"/>
  <circle cx="115" cy="90" r="5" fill="#5D4037"/>
  <circle cx="85" cy="105" r="4" fill="#5D4037"/>
  <circle cx="105" cy="95" r="6" fill="#5D4037"/>
  <circle cx="120" cy="110" r="4" fill="#5D4037"/>
  <circle cx="90" cy="115" r="5" fill="#5D4037"/>
  <circle cx="110" cy="115" r="4" fill="#5D4037"/>

  <!-- Additional chocolate chips for detail -->
  <circle cx="70" cy="100" r="3" fill="#6D4C41"/>
  <circle cx="125" cy="100" r="3" fill="#6D4C41"/>
  <circle cx="100" cy="108" r="3" fill="#6D4C41"/>

  <!-- Surface details (small dots for texture) -->
  <circle cx="80" cy="95" r="1.5" fill="#A0826D" opacity="0.6"/>
  <circle cx="100" cy="88" r="1.5" fill="#A0826D" opacity="0.6"/>
  <circle cx="118" cy="98" r="1.5" fill="#A0826D" opacity="0.6"/>
  <circle cx="92" cy="110" r="1.5" fill="#A0826D" opacity="0.6"/>
  <circle cx="108" cy="105" r="1.5" fill="#A0826D" opacity="0.6"/>

  <!-- Second biscotto partially behind (for stack effect) -->
  <ellipse cx="85" cy="120" rx="50" ry="40" fill="#D4A574" stroke="#B8956A" stroke-width="2" opacity="0.7"/>
  <ellipse cx="85" cy="120" rx="45" ry="35" fill="#C19A6B" opacity="0.4"/>

  <!-- Chocolate chips on second biscotto -->
  <circle cx="65" cy="110" r="4" fill="#5D4037" opacity="0.7"/>
  <circle cx="80" cy="115" r="3" fill="#5D4037" opacity="0.7"/>
  <circle cx="95" cy="125" r="4" fill="#5D4037" opacity="0.7"/>
  <circle cx="75" cy="130" r="3" fill="#5D4037" opacity="0.7"/>

  <!-- Highlights for 3D effect -->
  <ellipse cx="95" cy="88" rx="15" ry="10" fill="#FFFFFF" opacity="0.2"/>
  <ellipse cx="110" cy="95" rx="12" ry="8" fill="#FFFFFF" opacity="0.15"/>
</svg>
