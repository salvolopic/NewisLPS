<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Addetti - NewisLPS</title>
   <link rel="stylesheet" href="/css/common-styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <div class="logo-text">NewisLPS</div>
            </div>
            <div class="machine-name">Gestione Addetti</div>
            <div class="user-info">
                <div class="user-name">Admin: Luca Verdi</div>
            </div>
        </div>

        <!-- Menu navigazione -->
        <div class="tabs">
            <a href="gestore-main.html" class="tab" style="text-decoration: none;">STATO MACCHINE</a>
            <a href="gestore-distributori.html" class="tab" style="text-decoration: none;">DISTRIBUTORI</a>
            <a href="gestore-addetti.html" class="tab active" style="text-decoration: none;">ADDETTI</a>
        </div>

        <!-- Aggiunta nuovo addetto -->
        <div class="action-section">
            <div class="action-title title-center">Nuovo Addetto</div>
            
            <form id="form-nuovo-addetto">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="nome" placeholder="Nome" required>
                </div>

                <div class="form-group">
                    <label>Cognome</label>
                    <input type="text" id="cognome" placeholder="Cognome" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="email@esempio.it" required>
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="ID Addetto" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label>Zona di competenza</label>
                    <select id="zona">
                        <option>Tutte le zone</option>
                        <option>Edificio A</option>
                        <option>Edificio B</option>
                        <option>Edificio C</option>
                        <option>Edificio D</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Telefono</label>
                    <input type="tel" id="telefono" placeholder="+39 333 1234567">
                </div>

                <button type="submit" class="btn">Aggiungi Addetto</button>
            </form>
        </div>

        <!-- Lista addetti esistenti -->
        <div class="action-section">
            <div class="action-title">Addetti Registrati</div>
            <div class="machine-list" id="addetti-list"></div>
        </div>
    </div>

    <script src="/js/gestore-addetti.js"></script>
</body>
</html>
